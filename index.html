<!DOCTYPE html>
<html>
<head>
  <title>Print Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#f5f5f5;font-family:sans-serif;">

  <button onclick="printPDF()" style="
    font-size:28px;
    padding:30px 50px;
    border:none;
    border-radius:12px;
    background:black;
    color:white;
  ">
    PRINT FORM
  </button>

<script>
function printPDF() {
  const link = 'https://www.spencerhouse.ca/_files/ugd/583605_cfdcc5c295a1499c88cb304b39e0769a.pdf';

  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = link;

  document.body.appendChild(iframe);

  iframe.onload = function() {
    iframe.contentWindow.print();
  };
}
</script>

</body>
</html>
