<!DOCTYPE html>
<html>
<head>
  <title>Print Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#f5f5f5;font-family:sans-serif;">

  <button onclick="printPDF()" style="
    font-size:28px;
    padding:30px 50px;
    border:none;
    border-radius:12px;
    background:black;
    color:white;
  ">
    PRINT FORM
  </button>

  <script>
    function printPDF() {
      const win = window.open('https://www.spencerhouse.ca/_files/ugd/583605_552822af15894865b54c0fac3c69d92d.pdf', '_blank');
      win.onload = function() {
        win.print();
      };
    }
  </script>

</body>
</html>
